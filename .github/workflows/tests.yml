name: tests

# tradecore is a dependency of systems whose own test suites are the gate for every
# extraction wave. A red build here is a red build in every consumer, so it runs on the same
# Python and the same tools they do.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately NOT ".[dev]" plus extras: the isolation test asserts the suite passes
      # with only pydantic installed, and that assertion is worth nothing if the runner has
      # a consumer's dependency tree sitting in site-packages.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      # Source only, matching how the consumers run it. The tests are not type-checked.
      - name: mypy
        run: mypy src

      # A skip must fail the build, for the same reason it does in the consumers: a silent
      # skip and full coverage render identically, and this suite is small enough that any
      # skip is a defect rather than an environment difference.
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.out
          if grep -qE '[0-9]+ skipped' pytest.out; then
            echo "::error::CI skipped tests. This suite is the proof that the shared package still behaves; a skip makes it prove less than it claims."
            exit 1
          fi
